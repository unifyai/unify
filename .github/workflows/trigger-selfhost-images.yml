name: Trigger self-host image publish

# Dispatches unifyai/unify-deploy's Publish self-host images workflow when
# Unity sources that ship in those images change on staging/main.
on:
  push:
    branches: [staging, main]
    paths:
    - 'unify/**'
    - 'agent-service/**'
    - 'scripts/**'
    - 'deploy/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - '.github/workflows/trigger-selfhost-images.yml'
  workflow_dispatch:

# Debouncer semantics: let an in-flight publish dispatch finish; only the
# pending slot is replaced when staging/main keeps moving.
concurrency:
  group: trigger-selfhost-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    # A repository dispatch is a write on the target repository, so this uses
    # unifyai-ci-dispatch (4606148) rather than the clone App: it is the one
    # App that carries Contents: Write, and it is installed on unify-deploy
    # alone, so that write cannot reach any other repository. An App id is not
    # a secret. This step fails loudly when the key is absent, which is what
    # the hand-rolled empty check here used to do.
    - name: Mint a token that can dispatch to unify-deploy
      id: dispatch-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606148'
        private-key: ${{ secrets.CI_DISPATCH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: unify-deploy

    - name: Trigger unifyai/unify-deploy Publish self-host images
      env:
        GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        UNITY_REF: ${{ github.ref_name }}
        UNITY_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        gh api repos/unifyai/unify-deploy/dispatches \
          --method POST \
          --input - <<EOF
        {
          "event_type": "publish-selfhost-images",
          "client_payload": {
            "unity_ref": "${UNITY_REF}",
            "unity_sha": "${UNITY_SHA}"
          }
        }
        EOF
        echo "Dispatched publish-selfhost-images to unify-deploy (ref=${UNITY_REF} sha=${UNITY_SHA})"
