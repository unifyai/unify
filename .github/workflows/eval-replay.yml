name: Eval Replay
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Eval replay (scheduled)' ||
    'Eval replay (manual)'
  }}

# Replays the eval-marked suite against the recorded LLM cache, so a code
# change that breaks how a model's response is parsed, validated or executed
# surfaces without anyone having tagged a commit.
#
# Nothing here calls a provider. The Tests matrix pins UNILLM_CACHE=read-only
# and refuses to let a caller override it, and read-only raises on a miss
# rather than falling through to a paid request. That is what makes this safe
# to schedule while LLM Cache Refresh stays behind its LLM_SPEND_OK gate —
# the same reasoning that lets llm-cache-keepalive sit on a cron.
#
# Why the eval suite needs its own trigger at all: the Tests matrix only runs
# on a push or PR whose message carries [run-tests], so on an untagged commit
# nothing runs it. These tests are also the ones a marker filter hides, since
# parallel_run.sh only selects them under --eval-only. That combination let a
# real defect sit undetected for months: Optional[T] collapsed to a bare T in
# generated tool schemas, leaving a model no way to express "no value", and
# the four execute_code steering evals had been failing since a prompt change
# taught the model to fill those parameters in.
#
# The two ways this goes red mean different things:
#
#   assertion failure — the recorded response still arrives but the code now
#     does the wrong thing with it. A regression. Read the diff.
#   cache miss        — the request no longer matches anything recorded, so
#     the prompt or tool-schema surface moved underneath the corpus. Not a
#     code regression on its own; re-record the affected path with the
#     protected LLM Cache Refresh workflow (--eval-only), which is where the
#     spend is acknowledged.
#
# Unlike tests/flows this suite genuinely replays: those embed fresh per-run
# identifiers in later-turn prompts and can never hit cache, which is why they
# live on the spend-acknowledged Flow Smoke trigger instead.

on:
  schedule:
  # Daily, off-peak, offset from the other crons in this repo so a shared
  # runner pool is not contended at the same minute.
  - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      test_path:
        description: "Paths to replay ('.' for the whole eval suite)"
        required: false
        type: string
        default: "."

permissions:
  contents: read
  # Reading the cross-branch llm-cache-ndjson artifact.
  actions: read

# A running replay finishes; only the pending slot is replaced. Cancelling a
# replay mid-flight would leave the corpus half-checked and report nothing.
concurrency:
  group: eval-replay-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  replay:
    name: Replay the eval suite from cache
    uses: ./.github/workflows/tests.yml
    # Reusable-workflow plumbing, not a credential: the Tests matrix needs the
    # same repository secrets it already runs with on its own triggers (cloning
    # the sibling repos, authenticating to GCP), so inheriting grants no access
    # that workflow does not have anyway.
    secrets: inherit  # pragma: allowlist secret
    with:
      test_path: ${{ inputs.test_path || '.' }}
      # The whole point is the full eval suite, and the marker filter is what
      # keeps that from becoming the full test matrix: discovery narrows to the
      # paths that actually carry eval tests.
      confirm_full_matrix: FULL_MATRIX_OK
      parallel_run_args: --eval-only
